<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>SASCI 2026-27</title><style>
/* ── type scale ────────────────────────────────────
   t1 34  dashboard title
   t2 14  section heading (green bar, uppercase)
   t3 13  body / table
   t4 11  labels, captions, eyebrows (uppercase, tracked)
   metrics: hero 30, mid 20, unit always ~45% of its number
   ─────────────────────────────────────────────────── */
:root{
  --dark:#34613A; --dark-d:#2A4E2F; --lime:#B9CD46; --green:#5C9E4F; --teal:#6BBDB6;
  --amber:#D6A63C; --red:#BC5140; --track:#E6E9E3; --line:#DCE4D8; --line2:#EBF0E8;
  --ink:#25322A; --soft:#6C7A6B; --bg:#F5F7F3; --panel:#FFF;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:Aptos,"Aptos Display","Segoe UI Variable","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  font-size:13px;line-height:1.45;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
h1,h2{margin:0;font-weight:600}
.wrap{max-width:1150px;margin:0 auto;padding:18px 16px 44px}

/* masthead */
.title{background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--dark);
  padding:18px 20px 16px;text-align:center;margin-bottom:14px;position:relative}
.title .dept{color:var(--soft);font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:500}
.title h1{color:var(--dark);font-size:34px;letter-spacing:.01em;line-height:1.05;margin:6px 0 5px;font-weight:600}
.title .sub{color:var(--soft);font-size:12px;letter-spacing:.02em}
.title .asof{position:absolute;right:20px;top:18px;font-size:11px;color:var(--soft);text-align:right;line-height:1.5}
.title .asof b{display:block;color:var(--dark);font-size:12px;font-weight:600}

/* panels */
.box{background:var(--panel);border:1px solid var(--line);margin-bottom:14px}
.box>h2{background:var(--dark);color:#fff;font-size:14px;letter-spacing:.08em;text-transform:uppercase;
  padding:9px 16px;text-align:center;font-weight:600}
.box .bd{padding:18px}
.grid{display:grid;gap:14px}
.gh{grid-template-columns:1fr 1fr}

/* dials */
.rings{display:flex;gap:16px;align-items:center;justify-content:space-around;flex-wrap:wrap}
.rb{text-align:center;flex:1;min-width:88px}
.dial{position:relative;width:88px;height:88px;margin:0 auto}
.dial svg{width:100%;height:100%;display:block;overflow:visible}
.dial .tk{fill:none;stroke:var(--track);stroke-width:8}
.dial .fl{fill:none;stroke-width:8;stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%}
.dial .val{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;line-height:1}
.dial .val b{font-size:20px;font-weight:600;color:var(--ink);letter-spacing:-.01em}
.dial .val i{font-size:10px;font-style:normal;color:var(--soft);font-weight:500;
  align-self:flex-start;margin-top:26px;margin-left:1px}
.rb .lb{font-size:11px;color:var(--soft);margin-top:9px;text-transform:uppercase;letter-spacing:.06em;font-weight:500}
.rb.hero{flex:0 0 auto}
.rb.hero .dial{width:132px;height:132px}
.rb.hero .dial .tk,.rb.hero .dial .fl{stroke-width:7}
.rb.hero .val b{font-size:30px}
.rb.hero .val i{font-size:14px;margin-top:34px;margin-left:2px}
.rb.hero .lb{font-size:11px;color:var(--dark);font-weight:600}
.c-lime .fl{stroke:var(--lime)}.c-green .fl{stroke:var(--green)}.c-teal .fl{stroke:var(--teal)}
.c-amber .fl{stroke:var(--amber)}.c-red .fl{stroke:var(--red)}.c-grey .fl{stroke:#B6BCB4}

/* stat stack beside a hero dial */
.split{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center}
.stack{display:flex;flex-direction:column;gap:0}
.stack .row{display:flex;justify-content:space-between;align-items:baseline;gap:14px;
  padding:9px 0;border-bottom:1px solid var(--line2)}
.stack .row:last-child{border-bottom:0}
.stack .row span{font-size:11px;color:var(--soft);text-transform:uppercase;letter-spacing:.06em;font-weight:500}
.stack .row b{font-size:20px;font-weight:600;color:var(--ink);white-space:nowrap}
.stack .row b small{font-size:11px;font-weight:500;color:var(--soft);margin-right:1px}
.panel-foot{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);
  display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.panel-foot div{font-size:11px;color:var(--soft);text-transform:uppercase;letter-spacing:.06em;font-weight:500}
.panel-foot b{display:block;font-size:18px;color:var(--ink);text-transform:none;letter-spacing:0;margin-top:3px;font-weight:600}

/* part tiles */
.tiles{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.tile{background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--track);
  padding:11px 9px 12px;cursor:pointer;text-align:center;font:inherit;color:inherit;transition:background .12s}
.tile:hover{background:#FAFCF8}
.tile[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--dark)}
.tile.s-green{border-top-color:var(--green)}.tile.s-teal{border-top-color:var(--teal)}
.tile.s-amber{border-top-color:var(--amber)}.tile.s-red{border-top-color:var(--red)}
.tile.s-grey{border-top-color:#B6BCB4}
.tile .rn{font-size:11px;font-weight:600;color:var(--dark);text-transform:uppercase;letter-spacing:.07em}
.tile .nm{font-size:11px;color:var(--soft);margin:6px 0 8px;line-height:1.35;height:44px;overflow:hidden}
.tile .sc{font-size:20px;font-weight:600}
.tile .amt{font-size:11px;color:var(--soft);margin-top:3px;font-weight:500}

/* detail */
.detail{border:1px solid var(--line);border-top:none;background:#FAFCF8;padding:18px 20px;display:none;margin-top:-14px;margin-bottom:14px}
.detail.on{display:block}
.detail h3{margin:0;font-size:16px;font-weight:600;color:var(--dark)}
.detail .meta{font-size:11px;color:var(--soft);margin:4px 0 14px;text-transform:uppercase;letter-spacing:.05em}
.detail .cols{display:grid;grid-template-columns:1fr 1fr;gap:26px}
.detail h4{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--dark);margin:0 0 7px;font-weight:600}
.detail ul{margin:0 0 4px;padding-left:16px}
.detail li{font-size:13px;margin-bottom:6px;line-height:1.45}

/* bars */
.brow{display:grid;grid-template-columns:150px 1fr auto;gap:12px;align-items:center;padding:6px 0;font-size:13px}
.brow .k{color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow .t{background:var(--track);height:14px}.brow .t i{display:block;height:100%}
.brow .v{font-weight:600;min-width:44px;text-align:right}
.f-green{background:var(--green)}.f-red{background:var(--red)}.f-lime{background:var(--lime)}
.sub-h{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--dark);font-weight:600;margin-bottom:8px}

/* table */
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line2);text-align:left}
thead th{background:#F1F5EE;border-bottom:1px solid var(--dark);font-size:11px;text-transform:uppercase;
  letter-spacing:.06em;color:var(--dark);font-weight:600;position:sticky;top:0;cursor:pointer;white-space:nowrap}
th.num,td.num{text-align:right}tbody tr:hover{background:#FAFCF8}
.tw{max-height:340px;overflow:auto;border:1px solid var(--line)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chips button{font:inherit;font-size:11px;text-transform:uppercase;letter-spacing:.05em;font-weight:500;
  padding:5px 11px;background:var(--panel);border:1px solid var(--line);cursor:pointer;color:var(--soft)}
.chips button[aria-pressed="true"]{background:var(--dark);color:#fff;border-color:var(--dark)}

/* next actions */
.win{display:grid;grid-template-columns:1fr 150px;gap:16px;padding:11px 0;
  border-bottom:1px solid var(--line2);align-items:center}
.win .a{font-size:13px;line-height:1.45}
.win .a small{display:block;color:var(--soft);font-size:11px;margin-top:3px;text-transform:uppercase;letter-spacing:.04em}
.win .g{text-align:right;font-size:16px;font-weight:600;color:var(--green)}
.win .g small{display:block;font-weight:500;color:var(--soft);font-size:11px;text-transform:uppercase;letter-spacing:.05em;margin-top:2px}
.win.hd{padding:0 0 7px;border-bottom:1px solid var(--dark)}
.win.hd .a,.win.hd .g{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--dark);font-weight:600}
.note{margin-top:12px;font-size:11px;color:var(--soft);line-height:1.5}

/* timelines */
.cal .r{display:grid;grid-template-columns:110px 1fr 150px;gap:16px;padding:10px 0;
  border-bottom:1px solid var(--line2);font-size:13px;align-items:baseline}
.cal .r:last-child{border-bottom:0}
.cal .d{font-weight:600;font-size:13px}
.cal .d small{display:block;font-weight:500;color:var(--soft);font-size:11px;text-transform:uppercase;letter-spacing:.04em}
.cal .r.crit .d{color:var(--red)}
.cal .ow{color:var(--soft);font-size:11px;text-align:right;text-transform:uppercase;letter-spacing:.04em}

/* connect */
.cx{background:var(--panel);border:1px solid var(--line);margin-bottom:14px}
.cx>summary{cursor:pointer;padding:10px 16px;color:var(--soft);font-weight:500;list-style:none;
  font-size:11px;text-transform:uppercase;letter-spacing:.07em}
.cx>summary::-webkit-details-marker{display:none}
.cx>summary:before{content:"\25B8  "}.cx[open]>summary:before{content:"\25BE  "}
.cx .cb{padding:4px 16px 16px;border-top:1px solid var(--line2)}
.cx input{width:100%;max-width:560px;font:inherit;font-size:12px;padding:7px 10px;
  border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.cx button{margin-top:9px;font:inherit;font-size:11px;text-transform:uppercase;letter-spacing:.07em;
  font-weight:600;padding:7px 18px;background:var(--dark);color:#fff;border:0;cursor:pointer}
.cx .msg{font-size:12px;min-height:16px;margin:9px 0 0}
.cx .msg.good{color:var(--green);font-weight:500}.cx .msg.bad{color:var(--red);font-weight:500}
footer{font-size:11px;color:var(--soft);text-align:center;padding-top:6px;letter-spacing:.04em}

@media (max-width:900px){
  .gh,.detail .cols,.split{grid-template-columns:1fr}
  .split{justify-items:center;gap:16px}
  .tiles{grid-template-columns:repeat(3,1fr)}
  .title h1{font-size:26px}.title .asof{position:static;text-align:center;margin-top:8px}
  .cal .r,.win,.brow{grid-template-columns:1fr;gap:4px}
  .cal .ow,.win .g{text-align:left}
}
@media print{body{background:#fff}.tw{max-height:none}.cx,.chips{display:none}}

.tile .lead{font-size:10px;color:var(--soft);margin-top:2px;text-transform:uppercase;letter-spacing:.05em}
.tile.na{opacity:.5}
.detail .gl{font-size:11px;color:var(--soft);margin-top:12px;padding-top:9px;border-top:1px solid var(--line2);line-height:1.5}
</style></head><body>

const num=v=>{const n=parseFloat(String(v).replace(/[^0-9.\-]/g,""));return isNaN(n)?0:n;};
let REG=[], ULBS=[], LIVE=false, MONEY_AS_ON="11.09.2026";

function parseCSV(t){
  t=t.replace(/^\uFEFF/,"");const rows=[];let row=[],f="",q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c==='"'&&t[i+1]==='"'){f+='"';i++;}else if(c==='"')q=false;else f+=c;}
    else if(c==='"')q=true;else if(c===','){row.push(f);f="";}
    else if(c==='\n'){row.push(f);rows.push(row);row=[];f="";}else if(c!=='\r')f+=c;}
  if(f.length||row.length){row.push(f);rows.push(row);}
  if(!rows.length)return[];
  const head=rows.shift().map(h=>h.trim().toLowerCase());
  return rows.filter(r=>r.some(v=>v.trim()!=="")).map(r=>Object.fromEntries(head.map((h,i)=>[h,(r[i]||"").trim()])));
}

/* Script-tag load: no CORS, works from GitHub Pages or a local file alike. */
function gvizOnce(id,suffix,want,cb){
  const name="__sasci_cb_"+Date.now()+"_"+Math.floor(Math.random()*1e6);
  const el=document.createElement("script");let fired=false;
  const timer=setTimeout(()=>{if(!fired){clean();cb("NO_REPLY");}},15000);
  function clean(){fired=true;clearTimeout(timer);try{delete window[name];}catch(e){window[name]=undefined;}
    if(el.parentNode)el.parentNode.removeChild(el);}
  window[name]=function(resp){
    clean();
    if(resp&&resp.status==="error"){const e=(resp.errors&&resp.errors[0])||{};
      return cb(String(e.detailed_message||e.message||e.reason||"error").replace(/<[^>]*>/g,"").trim());}
    if(!resp||!resp.table||!resp.table.cols)return cb("No data returned for that tab.");
    try{
      const t=resp.table;
      let head=t.cols.map(c=>String(c.label||"").trim().toLowerCase());
      let rows=t.rows?t.rows.map(r=>(r.c||[]).map(c=>c?(c.f!=null?String(c.f):(c.v!=null?String(c.v):"")):"")):[];
      if(!head.filter(Boolean).length&&rows.length)head=rows.shift().map(x=>String(x).trim().toLowerCase());
      if(head.indexOf(want)<0){for(let k=0;k<Math.min(5,rows.length);k++){
        if(rows[k].some(v=>String(v).trim().toLowerCase()===want)){
          head=rows[k].map(x=>String(x).trim().toLowerCase());rows=rows.slice(k+1);break;}}}
      if(head.indexOf(want)<0)return cb("WRONG_TAB");
      cb(null,rows.filter(r=>r.some(v=>String(v).trim()!==""))
                  .map(r=>Object.fromEntries(head.map((hh,i)=>[hh,String(r[i]==null?"":r[i]).trim()]))));
    }catch(err){cb("Could not read that tab ("+err.message+").");}
  };
  el.onerror=()=>{if(!fired){clean();cb("NO_REPLY");}};
  el.src="https://docs.google.com/spreadsheets/d/"+id+"/gviz/tq?tqx=out:json;responseHandler:"+name+suffix+"&headers=1&t="+Date.now();
  document.body.appendChild(el);
}
function loadSheet(url,tab,want,done){
  const m=String(url).match(/spreadsheets\/d\/([\w-]+)/);
  if(!m)return done("That is not a Google Sheet link.");
  const tries=[];if(tab)tries.push("&sheet="+encodeURIComponent(tab));
  const g=String(url).match(/[#&?]gid=(\d+)/);if(g)tries.push("&gid="+g[1]);tries.push("");
  let i=0,saw=false,last="";
  (function next(){
    if(i>=tries.length){
      if(!saw)return done("The sheet did not reply. Use Share, then General access \u2018Anyone with the link\u2019 as Viewer.");
      if(last==="WRONG_TAB")return done("No tab has a column headed \u2018"+want+"\u2019. Check the tab is named \u2018"+tab+"\u2019 and row 1 holds the headings.");
      return done(last);}
    gvizOnce(m[1],tries[i++],want,(err,rows)=>{
      if(!err&&rows)return done(null,rows);
      if(err!=="NO_REPLY")saw=true;last=err;next();});
  })();
}

function ring(main,unit,pct,label,cls,hero){
  const R=44,C=2*Math.PI*R,on=Math.max(0,Math.min(100,pct))*C/100;
  return '<div class="rb '+cls+(hero?' hero':'')+'"><div class="dial">'+
    '<svg viewBox="0 0 100 100"><circle class="tk" cx="50" cy="50" r="'+R+'"/>'+
    '<circle class="fl" cx="50" cy="50" r="'+R+'" stroke-dasharray="'+on.toFixed(1)+' '+C.toFixed(1)+'"/></svg>'+
    '<div class="val"><b>'+main+'</b>'+(unit?'<i>'+unit+'</i>':'')+'</div></div>'+
    '<div class="lb">'+label+'</div></div>';
}
function bar(k,pct,v,cls){return '<div class="brow"><span class="k">'+esc(k)+'</span><span class="t">'+
  '<i class="'+cls+'" style="width:'+Math.max(1,Math.min(100,pct))+'%"></i></span><span class="v">'+v+'</span></div>';}

function counts(rows){
  const t={ok:0,part:0,no:0,na:0,total:0};
  rows.forEach(r=>{const s=r.status;
    if(s==="Not applicable")t.na++;
    else if(s==="Met")t.ok++;
    else if(s==="Partial")t.part++;
    else t.no++;});
  t.total=rows.length-t.na;return t;
}
const rowsOfPart=rn=>REG.filter(r=>(r.part||"").toUpperCase()===rn);
function score(rn){const t=counts(rowsOfPart(rn));return t.total?(t.ok+0.5*t.part)/t.total:0;}

function connect(url,done){
  loadSheet(url,CONFIG.SHEET_TAB,"item_id",(err,rows)=>{
    if(err)return done(err);
    REG=rows;LIVE=true;
    loadSheet(url,CONFIG.MONEY_TAB,"ulb",(e2,m)=>{
      let ok=false;
      if(!e2&&m){const out=m.map(x=>({name:x.ulb||x.name||"",alloc:num(x.allocation||x.alloc),exp:num(x.expenditure||x.exp)}))
        .filter(x=>x.name&&x.alloc>0);
        if(out.length){ULBS=out;ok=true;MONEY_AS_ON=(m.map(r=>r.as_on||r["as on"]||"").filter(Boolean)[0])||"";}}
      done(null,rows.length,ok);});
  });
}
function boot(){
  REG=parseCSV(document.getElementById('seed').textContent);
  ULBS=ULBS_FALLBACK.map(([name,alloc,exp])=>({name,alloc,exp}));
  if(CONFIG.SHEET_URL)return connect(CONFIG.SHEET_URL,()=>render());
  render();
}

function render(){
  document.getElementById('asof').textContent=LIVE?"Live":"31 Aug 2026";
  document.getElementById('srcline').textContent=LIVE?"reads the register on open":"embedded snapshot";
  drawHeadline();drawCal();drawTiles();drawWins();drawCapex();drawTable();drawOwners();
}

/* ── headline ── */
function drawHeadline(){
  const A=ULBS.reduce((s,u)=>s+u.alloc,0), E=ULBS.reduce((s,u)=>s+u.exp,0);
  const util=A?E/A*100:0;
  document.getElementById('p-money').innerHTML=
    '<div class="split">'+ring(Math.round(util),"%",util,"Utilisation","c-green",true)+
    '<div class="stack">'+
      '<div class="row"><span>Allocated</span><b><small>&#8377;</small>'+cr(A)+' Cr</b></div>'+
      '<div class="row"><span>Utilised</span><b><small>&#8377;</small>'+cr(E)+' Cr</b></div>'+
      '<div class="row"><span>Balance</span><b style="color:var(--red)"><small>&#8377;</small>'+cr(A-E)+' Cr</b></div>'+
    '</div></div>'+
    (MONEY_AS_ON?'<div class="note">Expenditure figures as on '+esc(MONEY_AS_ON)+'.</div>':'');

  const c=counts(REG);
  let pot=0, ind=0;
  Object.keys(AMOUNT).forEach(k=>{const a=AMOUNT[k];if(a==null)return;pot+=a;ind+=a*score(k);});
  document.getElementById('p-comp').innerHTML=
    '<div class="split">'+ring(c.total,"",100,"Requirements","c-lime",true)+
    '<div class="stack">'+
      '<div class="row"><span>Compliant</span><b style="color:var(--green)">'+c.ok+'</b></div>'+
      '<div class="row"><span>Partial</span><b style="color:var(--amber)">'+c.part+'</b></div>'+
      '<div class="row"><span>Non-compliant</span><b style="color:var(--red)">'+c.no+'</b></div>'+
    '</div></div>'+
    '<div class="panel-foot"><div>Incentive linked<b><small>&#8377;</small>'+pot.toFixed(0)+' Cr</b></div>'+
    '<div>Indicated at current level<b style="color:var(--amber)"><small>&#8377;</small>'+ind.toFixed(0)+' Cr</b></div>'+
    '<div>Realisation<b style="color:var(--amber)">'+Math.round(pot?ind/pot*100:0)+'%</b></div></div>';
}

function drawCal(){
  document.getElementById('cal').innerHTML=DEADLINES.map(x=>
    '<div class="r'+(x.crit?' crit':'')+'"><div class="d">'+esc(x.d)+
    (x.away?'<small>'+esc(x.away)+'</small>':'')+'</div><div>'+esc(x.what)+
    '</div><div class="ow">'+esc(x.o)+'</div></div>').join('');
}

/* ── parts ── */
let openPart=null;
function drawTiles(){
  const el=document.getElementById('tiles');el.innerHTML="";
  PARTS.forEach((p,i)=>{
    const t=counts(rowsOfPart(p.rn));p._t=t;
    let s="s-grey";
    if(t.total){const sc=(t.ok+0.5*t.part)/t.total;
      s=sc>=0.8?"s-green":sc>=0.5?"s-teal":sc>=0.25?"s-amber":"s-red";}
    const amt=AMOUNT[p.rn];
    const b=document.createElement('button');
    const na=(p.lead==="Not applicable"||p.lead==="Mining Dept"||p.lead==="Agriculture Dept");
    b.type="button";b.className="tile "+s+(na?" na":"");b.setAttribute('aria-pressed','false');
    b.innerHTML='<div class="rn">Part '+p.rn+'</div><div class="nm">'+esc(p.name)+'</div>'+
      '<div class="sc">'+(t.total?t.ok+'/'+t.total:'&mdash;')+'</div>'+
      '<div class="amt">'+(amt!=null?'&#8377;'+amt+' Cr':'&nbsp;')+'</div>'+
      '<div class="lead">'+esc(p.lead)+'</div>';
    b.addEventListener('click',()=>openDetail(i,b));
    el.appendChild(b);
  });
}
function openDetail(i,btn){
  const d=document.getElementById('detail');
  document.querySelectorAll('.tile').forEach(x=>x.setAttribute('aria-pressed','false'));
  if(openPart===i){openPart=null;d.className="detail";d.innerHTML="";return;}
  openPart=i;btn.setAttribute('aria-pressed','true');
  const p=PARTS[i],t=p._t,amt=AMOUNT[p.rn];
  const open=rowsOfPart(p.rn).filter(r=>r.status!=="Met"&&r.status!=="Not applicable").slice(0,6);
  d.className="detail on";
  d.innerHTML='<h3>Part '+p.rn+' &mdash; '+esc(p.name)+'</h3><div class="meta">'+esc(p.owner)+
    ' &nbsp;|&nbsp; '+(amt!=null?'&#8377;'+amt+' Cr earmarked for Punjab':'no Punjab incentive pool')+
    (t.total?' &nbsp;|&nbsp; '+t.ok+' of '+t.total+' compliant, '+t.part+' partial':'')+'</div>'+
    '<div class="cols"><div><h4>Position</h4><ul>'+p.facts.slice(0,3).map(f=>'<li>'+esc(f)+'</li>').join('')+'</ul></div>'+
    '<div><h4>Next</h4><ul>'+p.actions.slice(0,3).map(a=>'<li>'+esc(a)+'</li>').join('')+'</ul>'+
    (open.length?'<h4 style="margin-top:8px">Open items</h4><ul>'+open.map(r=>'<li>'+esc(r.item_id)+
      ' &mdash; '+esc(r.checklist_item)+' <i>('+esc(WORD[r.status]||r.status)+')</i></li>').join('')+'</ul>':'')+
    '</div></div>'+'<div class="gl">'+esc(p.role)+'</div>';
  if(d.scrollIntoView)d.scrollIntoView({behavior:'smooth',block:'nearest'});
}

/* ── biggest gains: what moving one item is worth ── */
function drawWins(){
  const out=[];
  REG.forEach(r=>{
    const rn=(r.part||"").toUpperCase();
    if(r.status==="Met"||r.status==="Not applicable")return;
    const t=counts(rowsOfPart(rn));if(!t.total)return;
    const amt=AMOUNT[rn];
    const step=(r.status==="Partial")?0.5:1;
    const gain=(amt!=null)?amt*step/t.total:0;
    out.push({r,rn,gain,near:r.status==="Partial",
      after:t.ok+(r.status==="Partial"?1:1)+"/"+t.total});
  });
  out.sort((a,b)=> (b.near-a.near) || (b.gain-a.gain));
  const el=document.getElementById('wins');
  if(!out.length){el.innerHTML='<div style="padding:10px 0;color:var(--green);font-weight:600">Everything is compliant.</div>';return;}
  el.innerHTML='<div class="win hd"><div>Action</div><div class="g">Indicative value</div></div>'+
    out.slice(0,10).map(w=>{
      const act=w.r.next_action||w.r.checklist_item;
      return '<div class="win"><div class="a">'+esc(String(act).slice(0,110))+
        '<small>Part '+esc(w.rn)+' &middot; '+esc(w.r.item_id)+' &middot; currently '+
        esc(WORD[w.r.status]||w.r.status).toLowerCase()+
        (w.r.owner_name||w.r.owner_role?' &middot; '+esc(w.r.owner_name||w.r.owner_role):'')+'</small></div>'+
        '<div class="g">'+(w.gain>0?'&#8377;'+w.gain.toFixed(2)+' Cr':'+1 compliance')+
        '<small>'+(w.near?'part complete':'not commenced')+'</small></div></div>';
    }).join('')+
    '<div class="note">Indicative value is the Part incentive apportioned across its requirements. Part-completed items appear first.</div>';
}

/* ── capex ── */
function rowsOf(){return ULBS.map(u=>{const un=u.alloc-u.exp,pct=u.exp/u.alloc*100,
  need=un/M_LEFT,ran=u.exp/M_DONE;
  return{name:u.name,alloc:u.alloc,exp:u.exp,pct,unspent:un,need,mult:ran>0?need/ran:Infinity};});}
function drawCapex(){
  const R=rowsOf(),A=R.reduce((s,r)=>s+r.alloc,0),E=R.reduce((s,r)=>s+r.exp,0);
  const stalled=R.filter(r=>r.pct<25).length;
  document.getElementById('r-money').innerHTML=
    ring(R.length,"",100,"ULBs","c-lime")+
    ring(stalled,"",stalled/R.length*100,"Under 25%","c-red")+
    ring(R.filter(r=>r.pct>=90).length,"",R.filter(r=>r.pct>=90).length/R.length*100,"Near complete","c-green")+
    ring(Math.round(E/A*100),"%",E/A*100,"Utilisation","c-teal");
  const top=R.slice().sort((a,b)=>b.unspent-a.unspent).slice(0,5),mx=top[0]?top[0].unspent:1;
  document.getElementById('b-unspent').innerHTML=
    '<div class="sub-h">Largest balances outstanding</div>'+
    top.map(r=>bar(r.name.replace(/^(Commissioner |Municipal Council |Municipal Corporation |MC |NP |Nagar Council )/,''),
      r.unspent/mx*100,cr(r.unspent),"f-red")).join('');
}
let sortKey='pct',sortDir=1,filter='all';
const F={all:()=>true,stalled:r=>r.pct<25,behind:r=>r.pct<PACE-10,big:r=>r.unspent>=3*CR,done:r=>r.pct>=90};
function drawTable(){
  const list=rowsOf().filter(F[filter]).sort((a,b)=>{const x=a[sortKey],y=b[sortKey];
    if(typeof x==='string')return x.localeCompare(y)*sortDir;
    return ((isFinite(x)?x:1e12)-(isFinite(y)?y:1e12))*sortDir;});
  document.getElementById('ulbb').innerHTML=list.map(r=>{
    const col=r.pct>=90?'var(--green)':r.pct>=PACE?'var(--teal)':r.pct>=25?'var(--amber)':'var(--red)';
    const mult=!isFinite(r.mult)?'&mdash;':r.mult.toFixed(1)+'x';
    const ms=(!isFinite(r.mult)||r.mult>2)?' style="color:var(--red);font-weight:700"':'';
    return '<tr><td><span class="dot" style="background:'+col+'"></span>'+esc(r.name)+'</td>'+
      '<td class="num">'+cr(r.alloc)+'</td><td class="num">'+cr(r.exp)+'</td>'+
      '<td class="num" style="font-weight:700;color:'+col+'">'+r.pct.toFixed(0)+'</td>'+
      '<td class="num">'+cr(r.unspent)+'</td><td class="num">'+cr(r.need)+'</td>'+
      '<td class="num"'+ms+'>'+mult+'</td></tr>';}).join('');
}
document.querySelectorAll('#ulbt thead th').forEach(th=>th.addEventListener('click',()=>{
  const k=th.dataset.k;if(!k)return;
  sortDir=(sortKey===k)?-sortDir:(k==='name'?1:-1);sortKey=k;drawTable();}));
document.querySelectorAll('#chips button').forEach(b=>b.addEventListener('click',()=>{
  filter=b.dataset.f;document.querySelectorAll('#chips button').forEach(x=>x.setAttribute('aria-pressed','false'));
  b.setAttribute('aria-pressed','true');drawTable();}));

function drawOwners(){
  const by={};
  REG.forEach(r=>{if(r.status==="Not applicable")return;
    const k=r.owner_name||r.owner_role||"Unassigned";(by[k]=by[k]||[]).push(r);});
  document.getElementById('owners').innerHTML=Object.entries(by).sort((a,b)=>b[1].length-a[1].length)
    .map(([k,rs])=>{const ok=rs.filter(r=>r.status==="Met").length;
      return bar(k,ok/rs.length*100,ok+"/"+rs.length,"f-green");}).join('');
}

document.getElementById('loadlink').addEventListener('click',()=>{
  const m=document.getElementById('cmsg'),u=document.getElementById('linkbox').value.trim();
  if(!u){m.className='msg bad';m.textContent="Paste the sheet link first.";return;}
  m.className='msg';m.textContent="Reading...";
  connect(u,(err,n,ok)=>{
    if(err){m.className='msg bad';m.textContent=err;return;}
    m.className='msg good';
    m.textContent="Connected. "+n+" register items. "+(ok?ULBS.length+" ULB rows from the Expenditure tab.":"No Expenditure tab found \u2014 using built-in figures.")+
"";
    render();});
});
boot();
